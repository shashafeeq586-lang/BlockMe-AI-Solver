name: Build BlockMe AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/partial-piece-detection

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlockMe-AI-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
